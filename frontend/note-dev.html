<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" href="img/icon-mnp.ico">
  <title>minimumpad – Editor de Textos online</title>
  
  <!-- CSS Personalizado -->
  <link rel="stylesheet" href="css/note-dev.css" />
</head>

<body>
  <div class="app-container">
    
    <!-- SIDEBAR -->
    <aside id="sidebar">
      <div class="sidebar-content">
        <div class="sidebar-header">
          <button id="toggleSidebarBtn" class="icon-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
          </button>
          <button id="sidebarAddNoteBtn" class="icon-btn" title="Nova Nota">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          </button>
        </div>
        <div class="sidebar-search">
          <input type="text" id="searchInput" placeholder="Buscar notas..." />
        </div>
        <ul id="noteList">
          <li class="note-item text-gray-500">Nenhuma nota encontrada.</li>
        </ul>
      </div>
      <div class="sidebar-actions">
        <!-- Footer buttons removed per request -->
        
        <div class="user-menu-wrapper sidebar-user-box">
          <button id="userIcon" class="user-profile-btn">
            <div class="user-avatar">
              <img src="img/user.svg" alt="User" />
            </div>
            <span>Minhas Informações</span>
          </button>
        </div>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <div class="main-content">
      
      <input id="noteTitle" type="hidden" />

      <!-- TAB BAR + TOGGLE -->
      <div class="tab-header-wrapper">
        <button id="openSidebarBtn" class="icon-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <div id="tabBar" class="tab-bar"></div>
        <button id="headerAddNoteBtn" class="icon-btn" title="Nova Nota">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
      </div>

      <!-- EDITOR + LINE-NUMBERS -->
      <main class="editor-container">
        <div id="lineNumbers"></div>
        <textarea id="noteContent" placeholder="Escreva aqui..." maxlength="5000"></textarea>
      </main>

      <!-- EMPTY STATE BACKGROUND (Dashboard representation) -->
      <div class="empty-state-overlay">
        <div class="empty-content">
          <img src="img/newfile.png" alt="Criar nova nota" class="empty-icon" />
          <h2>Sua mesa está limpa</h2>
          <p>Nenhuma nota aberta no momento. Que tal começar um novo pensamento ou organizar suas ideias?</p>
          <button class="btn-empty-state" onclick="document.getElementById('headerAddNoteBtn').click()">Criar Nova Nota</button>
        </div>
      </div>

      <!-- STATUS BAR -->
      <footer class="editor-statusbar">
         <span id="statusLines">0 linhas</span>
         <span id="statusChars">0 caracteres</span>
         <span id="statusSelection"></span>
      </footer>

    </div>
  </div>

  <!-- Scripts Mapeados (Preservados!) -->
  <script src="js/script-note-dev.js"></script>
</body>
</html>
